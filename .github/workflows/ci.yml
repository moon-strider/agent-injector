name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.8'
      - run: uv sync --locked --python 3.12 --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pip-audit --local --skip-editable --progress-spinner off

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.8'
      - run: uv sync --locked --python ${{ matrix.python }} --group dev
      - run: uv run --no-sync pytest -m 'not integration' --cov --cov-report=term-missing

  claude-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.8'
      - run: uv sync --locked --python 3.12 --group dev
      - name: Install the tested Claude Code version
        run: npm install --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund @anthropic-ai/claude-code@2.1.266
      - name: Exercise real CLI tools through a local Anthropic fixture
        run: AGENT_TEST_CLAUDE="$RUNNER_TEMP/claude/node_modules/.bin/claude" uv run --no-sync pytest tests/test_claude_integration.py --junitxml=junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: claude-integration-results
          path: junit.xml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.8'
      - run: uv sync --locked --python 3.12 --group dev
      - run: uv build
      - name: Install and inspect the wheel in a fresh environment
        run: |
          uv venv /tmp/agent-package
          uv pip install --python /tmp/agent-package/bin/python dist/*.whl
          cd /tmp
          /tmp/agent-package/bin/agent-injector --version
          /tmp/agent-package/bin/agent-injector --check
      - run: docker build -t agent-injector:test .
      - name: Check container executable and non-root account
        run: |
          docker run --rm agent-injector:test --check
          docker run --rm --entrypoint claude agent-injector:test --version
          docker run --rm --entrypoint python agent-injector:test -c 'import os; assert os.getuid() != 0'
